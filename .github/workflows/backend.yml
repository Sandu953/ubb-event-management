name: Backend

on:
  push:
    branches: [main, "feature/**"]
    paths:
      [
        "backend/**",
        "UbbEvents.sln",
        ".github/workflows/backend.yml",
        ".config/dotnet-tools.json",
      ]
  pull_request:
    paths:
      [
        "backend/**",
        "UbbEvents.sln",
        ".github/workflows/backend.yml",
        ".config/dotnet-tools.json",
      ]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - run: dotnet tool restore

      - run: dotnet restore UbbEvents.sln

      - run: dotnet build UbbEvents.sln --configuration Release --no-restore

      # EF Core needs a connection string to construct the DbContext.
      # This is a dummy CI-only connection string.
      - name: Check pending EF Core migrations
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=ubbevents_ci;Username=postgres;Password=postgres"
        run: dotnet ef migrations has-pending-model-changes --project backend/UbbEvents.Api --startup-project backend/UbbEvents.Api --configuration Release --no-build

      # Testcontainers manages its own PostgreSQL instance.
      - run: dotnet test UbbEvents.sln --configuration Release --no-build --logger trx --results-directory TestResults

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: TestResults/*.trx
